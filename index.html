<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Plantillas WhatsApp - Módulo 4</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen p-6">
  <div class="max-w-5xl mx-auto mb-6 text-center">
    <h1 class="text-3xl font-bold text-slate-800">Mis Plantillas WhatsApp</h1>
    <p id="contador-visitas" class="text-xs text-slate-400 mt-1"></p>
  </div>

  <!-- Dos columnas: formulario y generador a la izquierda, buscador + stats + tarjetas + barra de estado a la derecha -->
  <div class="max-w-5xl mx-auto grid gap-6 md:grid-cols-[340px_1fr]">
    
    <!-- Columna izquierda: acciones -->
    <div class="grid gap-6 self-start">
      
      <!-- 1. Formulario para crear o editar plantilla -->
      <form id="form-plantilla" class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 grid gap-3">
        <h2 id="titulo-form" class="font-bold text-slate-700 text-lg">Nueva Plantilla</h2>
        <input id="titulo" type="text" placeholder="Título (ej. Bienvenida)" required class="p-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <input id="hashtag" type="text" placeholder="Hashtag (ej. ventas)" required class="p-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        <textarea id="mensaje" rows="3" placeholder="Mensaje (usa {nombre} o {producto})" required class="p-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500"></textarea>
        
        <div class="flex gap-2">
          <button id="btn-submit" type="submit" class="flex-1 bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition shadow-sm">
            + Agregar plantilla
          </button>
          <button id="btn-cancelar" type="button" class="hidden bg-slate-200 hover:bg-slate-300 text-slate-700 font-semibold px-3 py-2.5 rounded-lg transition text-sm">
            Cancelar
          </button>
        </div>
      </form>

      <!-- 2. Generador: Usar plantilla y reemplazar variables -->
      <div class="bg-white p-5 rounded-xl shadow-sm border border-slate-200 grid gap-3">
        <h2 class="font-bold text-slate-700 text-lg">Usar Plantilla</h2>
        
        <select id="select-plantilla" class="p-2.5 border border-slate-300 rounded-lg text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
          <option value="">-- Selecciona una plantilla --</option>
        </select>

        <input id="input-nombre" type="text" placeholder="Valor para {nombre} (ej. Ana)" class="p-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
        <input id="input-producto" type="text" placeholder="Valor para {producto} (opcional)" class="p-2.5 border border-slate-300 rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">

        <button id="btn-generar" type="button" class="bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-lg transition shadow-sm">
          Generar mensaje
        </button>

        <!-- Caja de salida y botón Copiar -->
        <div id="caja-salida" class="hidden mt-2 p-3 bg-emerald-50 border border-emerald-200 rounded-lg grid gap-2">
          <p id="salida-mensaje" class="text-sm text-slate-800 whitespace-pre-wrap"></p>
          <button id="btn-copiar" type="button" class="bg-slate-800 hover:bg-slate-900 text-white text-xs font-semibold py-2 px-3 rounded-lg transition justify-self-end">
            📋 Copiar al portapapeles
          </button>
        </div>
      </div>

    </div>

    <!-- Columna derecha: Buscador + Estadísticas + Grid + Barra de Estado (HU4) -->
    <div class="grid gap-4 content-start">
      <input id="buscador" type="text" placeholder="🔍 Filtra por hashtag (ej. ventas)..." class="w-full p-2.5 bg-white border border-slate-300 rounded-lg text-sm shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
      
      <aside id="panel-stats" class="bg-white border border-slate-200 rounded-lg p-3 shadow-sm"></aside>
      
      <ul id="listaPlantillas" class="grid gap-3 sm:grid-cols-2"></ul>

      <!-- HU4: Barra de estado y botón Vaciar todo -->
      <div class="flex items-center justify-between border-t border-slate-200 pt-3 mt-1">
        <p id="estado" class="text-xs font-medium text-slate-600 bg-white border border-slate-200 px-3 py-1 rounded-full shadow-sm">Vacío</p>
        <button id="btn-vaciar" type="button" class="text-xs px-3 py-1.5 rounded-md border border-red-200 bg-red-50 text-red-600 hover:bg-red-100 font-medium transition">
          🗑️ Vaciar todo
        </button>
      </div>
    </div>

  </div>

  <script src="js/models/Template.js"></script>
  <script src="js/persistence.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
